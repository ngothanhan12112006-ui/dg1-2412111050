
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: dg1-flask:1.0
    expose:
      - "5000"
    volumes:
      - ./app/data:/app/app/data
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
    restart: unless-stopped
